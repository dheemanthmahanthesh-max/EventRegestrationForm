<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #bfdbfe);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .form-card {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(30, 64, 175, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
            padding: 35px 25px;
            text-align: center;
        }

        .header .icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            line-height: 1.6;
            color: #dbeafe;
        }

        .form-content {
            padding: 30px;
        }

        .section-title {
            color: #1d4ed8;
            font-size: 18px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin: 17px 0 8px;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #dbeafe;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #feedback {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            line-height: 1.8;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
            border: 2px solid #22c55e;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .processing {
            display: block !important;
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #60a5fa;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #f8fafc;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .form-content {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="header">
            <div class="icon">🎓</div>
            <h1>Event Registration</h1>
            <p>
                Welcome to our school event portal!
                Complete the form below to reserve your place.
            </p>
        </div>

        <div class="form-content">

            <h2 class="section-title">📝 Registration Details</h2>

            <form id="eventForm">

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" required minlength="3" placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="example@email.com">

                <label for="age">Age</label>
                <input type="number" id="age" required min="8" max="18" placeholder="Enter your age">

                <label for="eventName">Choose Your Event</label>
                <select id="eventName" required>
                    <option value="">Select an event</option>
                    <option value="Science Fair">🔬 Science Fair</option>
                    <option value="Coding Workshop">💻 Coding Workshop</option>
                    <option value="Art Competition">🎨 Art Competition</option>
                    <option value="Sports Day">🏆 Sports Day</option>
                </select>

                <button type="submit" id="registerButton">
                    Register Now →
                </button>

            </form>

            <div id="feedback">
                Your registration details will appear here.
            </div>

        </div>

        <div class="footer">
            © 2026 School Event Registration Portal | All Rights Reserved
        </div>

    </div>

    <script>
        const form = document.getElementById("eventForm");
        const feedback = document.getElementById("feedback");
        const registerButton = document.getElementById("registerButton");

        function registerEvent(event) {

            event.preventDefault();

            try {

                // PART 1: Constraint Validation API
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // PART 2: Accessing Form Data
                let studentName = document.getElementById("studentName").value.trim();
                let email = document.getElementById("email").value.trim();
                let age = Number(document.getElementById("age").value);
                let eventName = document.getElementById("eventName").value;

                // PART 3: Writing Validation Conditions
                if (studentName.length < 3) {
                    throw "Name must have at least 3 characters.";
                }

                if (age < 8 || age > 18) {
                    throw "Age must be between 8 and 18.";
                }

                if (eventName === "") {
                    throw "Please select an event.";
                }

                // PART 4: DOM Feedback before timer
                feedback.className = "processing";
                feedback.textContent = "⏳ Checking your registration details...\nPlease wait!";

                registerButton.disabled = true;
                registerButton.textContent = "Processing...";

                // PART 5: Timers and Random Numbers
                setTimeout(function () {

                    let passNumber = Math.floor(Math.random() * 9000) + 1000;

                    feedback.className = "success";

                    feedback.textContent =
                        "✅ REGISTRATION SUCCESSFUL!\n\n" +
                        "Student Name: " + studentName + "\n" +
                        "Email: " + email + "\n" +
                        "Age: " + age + "\n" +
                        "Event: " + eventName + "\n\n" +
                        "Your Event Pass Number: EVT-" + passNumber;

                    registerButton.disabled = false;
                    registerButton.textContent = "Register Another Student";

                }, 2000);

            } catch (error) {

                // PART 6: DOM Feedback for errors
                feedback.className = "error";
                feedback.textContent = "❌ Registration Failed!\n" + error;

                registerButton.disabled = false;
                registerButton.textContent = "Try Again";

            }
        }

        form.addEventListener("submit", registerEvent);

    </script>

</body>

</html>
